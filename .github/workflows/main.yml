name: Windows RDP 7 Hours

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rdp:
    runs-on: windows-2025
    timeout-minutes: 420

    steps:

      # =========================================
      # 1. CHECK SECRETS
      # =========================================
      - name: Check required secrets
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              throw "RDP_PASSWORD belum dibuat di GitHub Secrets."
          }

          if ([string]::IsNullOrWhiteSpace($env:NGROK_AUTHTOKEN)) {
              throw "NGROK_AUTHTOKEN belum dibuat di GitHub Secrets."
          }

          if ($env:RDP_PASSWORD.Length -lt 8) {
              throw "RDP_PASSWORD minimal 8 karakter."
          }

          Write-Host "Secrets tersedia."

      # =========================================
      # 2. ENABLE RDP
      # =========================================
      - name: Enable Remote Desktop
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Mengaktifkan Remote Desktop..."

          # Enable RDP
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          # Enable NLA
          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1

          # Firewall
          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          # RDP account
          $username = "rdpuser"

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          $user = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -PasswordNeverExpires `
                -UserMayNotChangePassword `
                -AccountNeverExpires

              Write-Host "User rdpuser dibuat."

          } else {

              Set-LocalUser `
                -Name $username `
                -Password $securePassword

              Write-Host "Password rdpuser diperbarui."
          }

          # Allow RDP login
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          # Make sure account is enabled
          Enable-LocalUser -Name $username

          # Restart RDP service
          Set-Service `
            -Name TermService `
            -StartupType Automatic

          Restart-Service `
            -Name TermService `
            -Force

          Write-Host "================================="
          Write-Host "RDP BERHASIL DIAKTIFKAN"
          Write-Host "Username: rdpuser"
          Write-Host "================================="

      # =========================================
      # 3. CHECK WINDOWS / SOFTWARE
      # =========================================
      - name: Check Windows environment
        shell: powershell
        run: |
          Write-Host "Windows:"
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Write-Host ""
          Write-Host "Chrome:"
          $chrome = Get-Command chrome.exe -ErrorAction SilentlyContinue

          if ($chrome) {
              Write-Host "Chrome tersedia: $($chrome.Source)"
          } else {
              Write-Host "Chrome tidak ditemukan."
          }

      # =========================================
      # 4. INSTALL EXTRA APPS
      # =========================================
      - name: Install 7-Zip, VLC and Steam
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "Memasang aplikasi..."

          winget source update

          winget install `
            --id 7zip.7zip `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          winget install `
            --id VideoLAN.VLC `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          winget install `
            --id Valve.Steam `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host ""
          Write-Host "Aplikasi selesai diproses."

      # =========================================
      # 5. INSTALL NGROK
      # =========================================
      - name: Install ngrok
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Memasang ngrok..."

          winget install `
            --id ngrok `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          $ngrok = Get-Command ngrok.exe `
            -ErrorAction SilentlyContinue

          if ($null -eq $ngrok) {

              $paths = @(
                "$env:LOCALAPPDATA\Microsoft\WinGet\Packages",
                "$env:ProgramFiles",
                "$env:ProgramFiles(x86)"
              )

              foreach ($path in $paths) {

                  if (Test-Path $path) {

                      $found = Get-ChildItem `
                        -Path $path `
                        -Filter "ngrok.exe" `
                        -Recurse `
                        -ErrorAction SilentlyContinue |
                        Select-Object -First 1

                      if ($found) {
                          $dir = Split-Path $found.FullName
                          $env:PATH += ";$dir"
                          break
                      }
                  }
              }
          }

          ngrok version

      # =========================================
      # 6. START NGROK
      # =========================================
      - name: Start RDP Tunnel
        shell: powershell
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Mengonfigurasi ngrok..."

          ngrok config add-authtoken `
            $env:NGROK_AUTHTOKEN

          Write-Host "Memulai tunnel RDP..."

          Start-Process `
            -FilePath "ngrok.exe" `
            -ArgumentList "tcp 3389" `
            -WindowStyle Hidden

          $tunnel = $null

          Write-Host "Menunggu alamat RDP..."

          for ($i = 1; $i -le 30; $i++) {

              Start-Sleep -Seconds 2

              try {

                  $response = Invoke-RestMethod `
                    -Uri "http://127.0.0.1:4040/api/tunnels" `
                    -ErrorAction Stop

                  if ($response.tunnels.Count -gt 0) {
                      $tunnel = $response.tunnels[0]
                      break
                  }

              } catch {

                  Write-Host "Tunnel belum siap..."
              }
          }

          if ($null -eq $tunnel) {
              throw "ngrok gagal membuat tunnel RDP."
          }

          $publicUrl = $tunnel.public_url

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "             RDP SIAP DIGUNAKAN"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "ADDRESS : $publicUrl"
          Write-Host "USER    : rdpuser"
          Write-Host "PASSWORD: RDP_PASSWORD"
          Write-Host ""
          Write-Host "DURASI  : MAKSIMAL 7 JAM"
          Write-Host ""
          Write-Host "=============================================="
          Write-Host ""

          # Simpan alamat sebagai output step
          "RDP_ADDRESS=$publicUrl" >> $env:GITHUB_ENV

      # =========================================
      # 7. KEEP ALIVE 7 HOURS
      # =========================================
      - name: Keep RDP Alive - Maximum 7 Hours
        shell: powershell
        run: |
          $maximumSeconds = 7 * 60 * 60

          $startTime = Get-Date
          $endTime = $startTime.AddHours(7)

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "              RDP SESSION AKTIF"
          Write-Host "=============================================="
          Write-Host "Mulai : $startTime"
          Write-Host "Selesai maksimal : $endTime"
          Write-Host "=============================================="
          Write-Host ""

          while ($true) {

              $elapsed =
                ((Get-Date) - $startTime).TotalSeconds

              if ($elapsed -ge $maximumSeconds) {

                  Write-Host ""
                  Write-Host "=============================================="
                  Write-Host "          BATAS 7 JAM TERCAPAI"
                  Write-Host "=============================================="

                  # Hentikan tunnel
                  Get-Process ngrok `
                    -ErrorAction SilentlyContinue |
                    Stop-Process -Force

                  # Hentikan RDP
                  Stop-Service TermService `
                    -Force `
                    -ErrorAction SilentlyContinue

                  Write-Host "RDP dan ngrok dihentikan."
                  exit 0
              }

              $remaining =
                [TimeSpan]::FromSeconds(
                  $maximumSeconds - $elapsed
                )

              Write-Host `
                "[$(Get-Date -Format 'HH:mm:ss')] " +
                "Sisa: " +
                "$($remaining.Hours) jam " +
                "$($remaining.Minutes) menit " +
                "$($remaining.Seconds) detik"

              Start-Sleep -Seconds 60
          }
